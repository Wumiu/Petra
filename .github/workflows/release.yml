name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Petra ${{ github.ref_name }}"
          releaseBody: |
            Petra ${{ github.ref_name }}

            下载 `Petra_*_x64-setup.exe`，解压后运行其中的 setup.exe 安装。
          releaseDraft: false
          prerelease: false
          # tauri-action 自动:构建 + 用 TAURI_SIGNING_PRIVATE_KEY 签名 updater artifacts
          # + 生成 latest.json(含 signature/url)作为 Release 附件
          includeUpdaterJson: true
