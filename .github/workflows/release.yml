name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Petra ${{ github.ref_name }}"
          releaseBody: |
            Petra ${{ github.ref_name }}

            下载 `Petra_*_x64-setup.exe`，解压后运行其中的 setup.exe 安装。
          releaseDraft: false
          prerelease: false
          # 注意：必须保持 prerelease=false，否则 GitHub releases/latest 不会指向本版本，
          # updater endpoint (releases/latest/download/latest.json) 将 404，客户端无法发现更新。
          # tauri-action 自动:构建 + 用 TAURI_SIGNING_PRIVATE_KEY 签名 updater artifacts
          # + 生成 latest.json(含 signature/url)作为 Release 附件
          includeUpdaterJson: true

      # 兼容性归一化：tauri-action 生成的 latest.json 中 windows-x86_64 默认指向 MSI，
      # 而 v0.1.5 legacy updater 固定读取该 key 并当作 .exe 启动。
      # 因此把 windows-x86_64 覆盖为 NSIS（与 windows-x86_64-nsis 一致），
      # 保留 windows-x86_64-msi。不硬编码版本/URL/signature，从 JSON 动态复制。
      - name: Normalize updater metadata (legacy compat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # 下载 tauri-action 生成的 latest.json
          gh release download "${{ github.ref_name }}" -p latest.json -R "${{ github.repository }}" -D /tmp/ --clobber
          # 归一化: windows-x86_64 → NSIS
          node scripts/normalize-updater-metadata.mjs /tmp/latest.json /tmp/latest-fixed.json
          # 以正确文件名重新生成（gh upload 按文件名命名 asset）
          cp /tmp/latest-fixed.json /tmp/latest.json
          # 删除旧的 latest.json asset
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets[] | select(.name=="latest.json") | .id')
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          # 上传归一化后的 latest.json（仅替换 metadata，不动 installer）
          gh release upload "${{ github.ref_name }}" /tmp/latest.json --clobber -R "${{ github.repository }}"
          echo "latest.json 已归一化并重新上传（windows-x86_64 → NSIS）"
